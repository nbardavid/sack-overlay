# Builds the mod on every push and pull request, so a broken build shows up before a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew && ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: sack-overlay
          path: build/libs/*.jar
